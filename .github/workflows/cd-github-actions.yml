name: CD - GitHub Actions

on:
  workflow_run:
    workflows: ["CI - GitHub Actions"]
    types:
      - completed
    branches: [main]

env:
  AZURE_WEBAPP_NAME: 'az400-dev-webapp'
  RESOURCE_GROUP: 'rg-az400-handson'

jobs:
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: development
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Check Web App existence
        run: |
          echo "🔍 Verifying Web App exists..."
          if ! az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &>/dev/null; then
            echo "❌ ERROR: Web App '${{ env.AZURE_WEBAPP_NAME }}' not found in resource group '${{ env.RESOURCE_GROUP }}'"
            echo "Available web apps in resource group:"
            az webapp list --resource-group ${{ env.RESOURCE_GROUP }} --query "[].{Name:name, State:state}" -o table
            exit 1
          fi
          echo "✅ Web App exists"
      
      - name: Set container image explicitly
        run: |
          echo "🐳 Configuring Web App to use ACR image..."
          IMAGE_PATH="${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}"
          echo "Image: $IMAGE_PATH"
          
          # Linux環境でパイプ文字を安全に扱うため、シングルクォートで囲む
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --linux-fx-version 'DOCKER|'"$IMAGE_PATH"
          
          echo "✅ Container image configured"
          
          # 設定確認
          ACTUAL_FX=$(az webapp config show -n ${{ env.AZURE_WEBAPP_NAME }} -g ${{ env.RESOURCE_GROUP }} --query 'linuxFxVersion' -o tsv)
          echo "Actual linuxFxVersion: $ACTUAL_FX"
          
          if [[ "$ACTUAL_FX" != *"${{ secrets.ACR_LOGIN_SERVER }}"* ]]; then
            echo "❌ ERROR: Registry URL missing in linuxFxVersion!"
            echo "Expected: DOCKER|$IMAGE_PATH"
            echo "Actual: $ACTUAL_FX"
            exit 1
          fi
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}
      
      - name: Re-apply container image configuration (post-deployment fix)
        run: |
          echo "🔧 Fixing linuxFxVersion after azure/webapps-deploy@v3..."
          echo "Issue: azure/webapps-deploy@v3 may override linuxFxVersion and remove registry URL"
          
          IMAGE_PATH="${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}"
          echo "Re-applying: DOCKER|$IMAGE_PATH"
          
          # デプロイ後に正しいlinuxFxVersionを再設定
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --linux-fx-version 'DOCKER|'"$IMAGE_PATH"
          
          # 設定確認
          ACTUAL_FX=$(az webapp config show -n ${{ env.AZURE_WEBAPP_NAME }} -g ${{ env.RESOURCE_GROUP }} --query 'linuxFxVersion' -o tsv)
          echo "✅ Verified linuxFxVersion: $ACTUAL_FX"
          
          if [[ "$ACTUAL_FX" != *"${{ secrets.ACR_LOGIN_SERVER }}"* ]]; then
            echo "❌ ERROR: Registry URL still missing!"
            echo "Expected: DOCKER|$IMAGE_PATH"
            echo "Actual: $ACTUAL_FX"
            exit 1
          fi
          
          echo "✅ Container image configuration fixed successfully"
      
      - name: Verify deployment and diagnose issues
        run: |
          echo "📋 Checking deployment status..."
          STATE=$(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query state -o tsv)
          echo "App state: $STATE"
          
          echo ""
          echo "🐳 Checking container configuration..."
          az webapp config container show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}
          
          echo ""
          echo "📝 Checking application settings..."
          az webapp config appsettings list --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "[?name=='WEBSITES_PORT' || name=='PORT' || name=='KEY_VAULT_URL' || name=='APPLICATIONINSIGHTS_CONNECTION_STRING'].{Name:name, Value:value}" -o table
          
          echo ""
          echo "📊 Fetching container logs (last 100 lines)..."
          az webapp log download --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --log-file deployment.log 2>/dev/null || true
          if [ -f deployment.log ]; then
            echo "=== Recent logs ==="
            tail -n 100 deployment.log
          else
            echo "⚠️  Log file not available yet"
          fi
          
          echo ""
          echo "🔧 Checking runtime status..."
          az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "{State:state, AvailabilityState:availabilityState, UsageState:usageState, OutboundIpAddresses:outboundIpAddresses}" -o json
      
      - name: Smoke test
        run: |
          echo "🔍 Waiting for container to start..."
          echo "Note: Initial container startup may take 3-5 minutes"
          
          # 最大5分間、15秒ごとにリトライ（20回）
          MAX_ATTEMPTS=20
          RETRY_DELAY=15
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo ""
            echo "Health check attempt $i/$MAX_ATTEMPTS..."
            
            # HTTPステータスコードを確認（エラーハンドリング改善）
            set +e  # 一時的にエラーで停止しない
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --connect-timeout 10 https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health 2>/dev/null)
            CURL_EXIT=$?
            set -e  # 再度エラーで停止するように
            
            # curlが失敗した場合は000をセット
            if [ $CURL_EXIT -ne 0 ] || [ -z "$HTTP_CODE" ]; then
              HTTP_CODE="000"
            fi
            
            # 出力のクリーンアップ（予期しない文字を除去）
            HTTP_CODE=$(echo "$HTTP_CODE" | tr -cd '0-9' | tail -c 3)
            
            echo "HTTP Status: $HTTP_CODE (curl exit: $CURL_EXIT)"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed!"
              echo "Container is healthy and responding"
              curl -s https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health | jq . || true
              exit 0
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "⚠️  Service Unavailable (503) - Container may still be starting..."
              if [ $i -ge 10 ]; then
                echo "  Hint: Container startup is taking longer than expected"
              fi
            elif [ "$HTTP_CODE" = "000" ]; then
              echo "❌ Connection failed - Timeout or network error"
              if [ $CURL_EXIT -eq 28 ]; then
                echo "  Reason: Request timeout (exceeded 30 seconds)"
              elif [ $CURL_EXIT -eq 7 ]; then
                echo "  Reason: Failed to connect to host"
              fi
            else
              echo "⚠️  Unexpected status code: $HTTP_CODE"
            fi
            
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "Waiting $RETRY_DELAY seconds before retry..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo ""
          echo "✗ Health check failed after $MAX_ATTEMPTS attempts (5 minutes)"
          echo "=== Final diagnostics ==="
          echo ""
          echo "📊 Checking Web App status..."
          az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "{state:state, availabilityState:availabilityState}" -o json || true
          
          echo ""
          echo "🐳 Checking container configuration..."
          az webapp config show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "{linuxFxVersion:linuxFxVersion, alwaysOn:alwaysOn}" -o json || true
          
          echo ""
          echo "📝 Recent container logs (last 50 lines)..."
          az webapp log tail --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --limit 50 2>&1 | head -n 50 || echo "Logs not available"
          
          echo ""
          echo "🔍 Attempting to access root URL..."
          curl -v --max-time 30 https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/ 2>&1 | head -n 80 || true
          exit 1
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Deployment failed - collecting diagnostic information ==="
          az webapp log download --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --log-file failure.log 2>/dev/null || true
          if [ -f failure.log ]; then
            echo "=== Full log file ==="
            cat failure.log
          fi
          
          echo ""
          echo "=== Container settings ==="
          az webapp config show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}
      
      - name: Notification
        if: always()
        run: |
          echo "Deployment to Development: ${{ job.status }}"
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: staging
      url: https://az400-staging-webapp.azurewebsites.net
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set container image explicitly
        run: |
          echo "🐳 Configuring Staging Web App to use ACR image..."
          IMAGE_PATH="${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}"
          echo "Image: $IMAGE_PATH"
          
          az webapp config set \
            --name 'az400-staging-webapp' \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --linux-fx-version 'DOCKER|'"$IMAGE_PATH"
          
          echo "✅ Container image configured"
          
          ACTUAL_FX=$(az webapp config show -n 'az400-staging-webapp' -g ${{ env.RESOURCE_GROUP }} --query 'linuxFxVersion' -o tsv)
          echo "Actual linuxFxVersion: $ACTUAL_FX"
          
          if [[ "$ACTUAL_FX" != *"${{ secrets.ACR_LOGIN_SERVER }}"* ]]; then
            echo "❌ ERROR: Registry URL missing!"
            exit 1
          fi
      
      - name: Deploy to Staging Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'az400-staging-webapp'
          images: ${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}
      
      - name: Re-apply container image configuration (post-deployment fix)
        run: |
          echo "🔧 Fixing linuxFxVersion after azure/webapps-deploy@v3..."
          echo "Issue: azure/webapps-deploy@v3 may override linuxFxVersion and remove registry URL"
          
          IMAGE_PATH="${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}"
          echo "Re-applying: DOCKER|$IMAGE_PATH"
          
          az webapp config set \
            --name 'az400-staging-webapp' \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --linux-fx-version 'DOCKER|'"$IMAGE_PATH"
          
          ACTUAL_FX=$(az webapp config show -n 'az400-staging-webapp' -g ${{ env.RESOURCE_GROUP }} --query 'linuxFxVersion' -o tsv)
          echo "✅ Verified linuxFxVersion: $ACTUAL_FX"
          
          if [[ "$ACTUAL_FX" != *"${{ secrets.ACR_LOGIN_SERVER }}"* ]]; then
            echo "❌ ERROR: Registry URL still missing!"
            exit 1
          fi
          
          echo "✅ Container image configuration fixed successfully"
      
      - name: Run integration tests
        run: |
          echo "🔍 Running integration tests..."
          echo "Note: Initial container startup may take 3-5 minutes"
          
          # 最大5分間、15秒ごとにリトライ（20回）
          MAX_ATTEMPTS=20
          RETRY_DELAY=15
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo ""
            echo "Health check attempt $i/$MAX_ATTEMPTS..."
            
            set +e
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --connect-timeout 10 https://az400-staging-webapp.azurewebsites.net/health 2>/dev/null)
            CURL_EXIT=$?
            set -e
            
            if [ $CURL_EXIT -ne 0 ] || [ -z "$HTTP_CODE" ]; then
              HTTP_CODE="000"
            fi
            
            HTTP_CODE=$(echo "$HTTP_CODE" | tr -cd '0-9' | tail -c 3)
            echo "HTTP Status: $HTTP_CODE (curl exit: $CURL_EXIT)"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed!"
              echo "Staging environment is healthy"
              curl -s https://az400-staging-webapp.azurewebsites.net/health | jq . || true
              exit 0
            elif [ "$HTTP_CODE" = "503" ] && [ $i -ge 10 ]; then
              echo "⚠️  Service Unavailable - Container startup taking longer than expected"
            fi
            
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "Waiting $RETRY_DELAY seconds before retry..."
              sleep $RETRY_DELAY
            fi
          done
          echo ""
          echo "✗ Health check failed after $MAX_ATTEMPTS attempts (5 minutes)"
          exit 1
      
      - name: Notification
        if: always()
        run: |
          echo "Deployment to Staging: ${{ job.status }}"
  
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://az400-prod-webapp.azurewebsites.net
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set container image explicitly
        run: |
          echo "🐳 Configuring Production Web App to use ACR image..."
          IMAGE_PATH="${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}"
          echo "Image: $IMAGE_PATH"
          
          az webapp config set \
            --name 'az400-prod-webapp' \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --linux-fx-version 'DOCKER|'"$IMAGE_PATH"
          
          echo "✅ Container image configured"
          
          ACTUAL_FX=$(az webapp config show -n 'az400-prod-webapp' -g ${{ env.RESOURCE_GROUP }} --query 'linuxFxVersion' -o tsv)
          echo "Actual linuxFxVersion: $ACTUAL_FX"
          
          if [[ "$ACTUAL_FX" != *"${{ secrets.ACR_LOGIN_SERVER }}"* ]]; then
            echo "❌ ERROR: Registry URL missing!"
            exit 1
          fi
      
      - name: Deploy to Production Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'az400-prod-webapp'
          images: ${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}
      
      - name: Re-apply container image configuration (post-deployment fix)
        run: |
          echo "🔧 Fixing linuxFxVersion after azure/webapps-deploy@v3..."
          echo "Issue: azure/webapps-deploy@v3 may override linuxFxVersion and remove registry URL"
          
          IMAGE_PATH="${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}"
          echo "Re-applying: DOCKER|$IMAGE_PATH"
          
          az webapp config set \
            --name 'az400-prod-webapp' \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --linux-fx-version 'DOCKER|'"$IMAGE_PATH"
          
          ACTUAL_FX=$(az webapp config show -n 'az400-prod-webapp' -g ${{ env.RESOURCE_GROUP }} --query 'linuxFxVersion' -o tsv)
          echo "✅ Verified linuxFxVersion: $ACTUAL_FX"
          
          if [[ "$ACTUAL_FX" != *"${{ secrets.ACR_LOGIN_SERVER }}"* ]]; then
            echo "❌ ERROR: Registry URL still missing!"
            exit 1
          fi
          
          echo "✅ Container image configuration fixed successfully"
      
      - name: Production smoke test
        run: |
          echo "🔍 Waiting for production container to start..."
          echo "Note: Initial container startup may take 3-5 minutes"
          
          # 最大5分間、15秒ごとにリトライ（20回）
          MAX_ATTEMPTS=20
          RETRY_DELAY=15
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo ""
            echo "Health check attempt $i/$MAX_ATTEMPTS..."
            
            set +e
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --connect-timeout 10 https://az400-prod-webapp.azurewebsites.net/health 2>/dev/null)
            CURL_EXIT=$?
            set -e
            
            if [ $CURL_EXIT -ne 0 ] || [ -z "$HTTP_CODE" ]; then
              HTTP_CODE="000"
            fi
            
            HTTP_CODE=$(echo "$HTTP_CODE" | tr -cd '0-9' | tail -c 3)
            echo "HTTP Status: $HTTP_CODE (curl exit: $CURL_EXIT)"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Production health check passed!"
              echo "Production environment is live and healthy"
              curl -s https://az400-prod-webapp.azurewebsites.net/health | jq . || true
              exit 0
            elif [ "$HTTP_CODE" = "503" ] && [ $i -ge 10 ]; then
              echo "⚠️  Service Unavailable - Container startup taking longer than expected"
            fi
            
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "Waiting $RETRY_DELAY seconds before retry..."
              sleep $RETRY_DELAY
            fi
          done
          echo ""
          echo "✗ Production health check failed after $MAX_ATTEMPTS attempts (5 minutes)"
          exit 1
      
      - name: Notify deployment
        run: |
          echo "🎉 Production deployment completed successfully!"
