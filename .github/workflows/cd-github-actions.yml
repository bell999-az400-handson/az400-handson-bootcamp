name: CD - GitHub Actions

on:
  workflow_run:
    workflows: ["CI - GitHub Actions"]
    types:
      - completed
    branches: [main]

env:
  AZURE_WEBAPP_NAME: 'az400-dev-webapp'
  RESOURCE_GROUP: 'rg-az400-handson'

jobs:
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: development
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}
      
      - name: Verify deployment
        run: |
          echo "📋 Checking deployment status..."
          STATE=$(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query state -o tsv)
          echo "App state: $STATE"
          
          echo "🐳 Checking container configuration..."
          az webapp config container show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}
      
      - name: Smoke test
        run: |
          echo "Waiting for container to start..."
          # 最大2分間、10秒ごとにリトライ
          for i in {1..12}; do
            echo "Health check attempt $i/12..."
            if curl -f --max-time 10 https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health; then
              echo "✓ Health check passed"
              exit 0
            fi
            if [ $i -lt 12 ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done
          echo "✗ Health check failed after 12 attempts (2 minutes)"
          exit 1
      
      - name: Notification
        if: always()
        run: |
          echo "Deployment to Development: ${{ job.status }}"
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: staging
      url: https://az400-staging-webapp.azurewebsites.net
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Staging Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'az400-staging-webapp'
          images: ${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}
      
      - name: Run integration tests
        run: |
          echo "Running integration tests..."
          # 最大2分間、10秒ごとにリトライ
          for i in {1..12}; do
            echo "Health check attempt $i/12..."
            if curl -f --max-time 10 https://az400-staging-webapp.azurewebsites.net/health; then
              echo "✓ Health check passed"
              exit 0
            fi
            if [ $i -lt 12 ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done
          echo "✗ Health check failed after 12 attempts (2 minutes)"
          exit 1
      
      - name: Notification
        if: always()
        run: |
          echo "Deployment to Staging: ${{ job.status }}"
  
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://az400-prod-webapp.azurewebsites.net
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Production Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'az400-prod-webapp'
          images: ${{ secrets.ACR_LOGIN_SERVER }}/az400webapp:${{ github.sha }}
      
      - name: Production smoke test
        run: |
          echo "Waiting for production container to start..."
          # 最大2分間、10秒ごとにリトライ
          for i in {1..12}; do
            echo "Health check attempt $i/12..."
            if curl -f --max-time 10 https://az400-prod-webapp.azurewebsites.net/health; then
              echo "✓ Production health check passed"
              exit 0
            fi
            if [ $i -lt 12 ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done
          echo "✗ Production health check failed after 12 attempts (2 minutes)"
          exit 1
      
      - name: Notify deployment
        run: |
          echo "🎉 Production deployment completed successfully!"
