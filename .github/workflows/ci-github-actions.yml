name: CI - GitHub Actions

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  WORKING_DIRECTORY: './src/webapp'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIRECTORY }}
      
      - name: Run linter
        run: npm run lint || echo "No lint script defined"
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true
      
      - name: Run tests
        run: npm test
        working-directory: ${{ env.WORKING_DIRECTORY }}
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          directory: ${{ env.WORKING_DIRECTORY }}/coverage
          fail_ci_if_error: false
  
  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write   # OIDC トークン取得に必要（Federated Identity 認証）
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login (OIDC / Federated Identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Login to Azure Container Registry
        run: |
          az acr login --name az400acr
      
      - name: Build and push Docker image
        run: |
          docker build -t az400acr.azurecr.io/az400webapp:${{ github.sha }} \
                       -t az400acr.azurecr.io/az400webapp:latest \
                       ${{ env.WORKING_DIRECTORY }}
          docker push az400acr.azurecr.io/az400webapp:${{ github.sha }}
          docker push az400acr.azurecr.io/az400webapp:latest
      
      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: az400acr.azurecr.io/az400webapp:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event_name == 'push'
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
